name: 每周一凌晨定时备份

on:
  schedule:
    # 北京时间每周一凌晨 01:00 = UTC 每周日 17:00
    - cron: '0 17 * * 0'
  workflow_dispatch: # 手动触发

jobs:
  run-backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 1. 拉取仓库代码
        uses: actions/checkout@v5   # 升级至 v5，支持 Node.js 24
        with:
          fetch-depth: 0

      - name: 2. 安装 Python 环境
        uses: actions/setup-python@v6   # 升级至 v6，支持 Node.js 24
        with:
          python-version: '3.10'

      - name: 3. 执行 Python 备份脚本
        run: python backup_json.py

      - name: 4. 提交并同步到仓库
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add backup/
          if git diff --staged --quiet; then
            echo "没有检测到任何内容变化，跳过提交。"
          else
            git commit -m "Auto Backup: $(date +'%Y-%m-%d %H:%M')"
            git push
          fi
